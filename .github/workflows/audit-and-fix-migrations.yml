name: Audit and Fix Supabase Migrations

# Verifies that the live project's `public` schema actually contains what
# supabase/migrations/ says it should, rather than trusting the migration
# history table. (That trust has failed before: a migration once sat marked
# "applied" without ever having run, and nothing noticed until PostgREST
# answered PGRST205 "Could not find the table ... in the schema cache".)
#
# The migration set is a baseline, 0001_baseline.sql, plus later migrations
# (0002_game_secrets.sql, 0003_game_assets.sql). This workflow
# dumps the live public schema and greps for one solid marker per key object
# the baseline creates (a table, a uniquely-named constraint/index/trigger/
# function, a column, or a policy name), one row per section of the
# baseline, so a report shows *which part* is missing rather than just
# "0001: missing". It also checks that objects from the pre-squash schema
# that the baseline deliberately no longer has are absent; those rows are
# report-only (fix version "-"), because the right fix for a leftover table
# is a human decision, not a re-run of the baseline.
#
# Patterns are matched against `supabase db dump`'s actual output, not
# assumed formatting — pg_dump double-quotes every identifier
# ("public"."games", "settings" "jsonb") and Postgres silently truncates
# identifiers over 63 bytes (a policy name in the old migration chain was
# cut off exactly that way). Both broke an earlier version of this audit and
# produced false positives, confirmed by re-running against a real dump.
# Every policy name in the baseline is at most 63 bytes, so the patterns
# below are full names, but verify any future pattern change against real
# dump output before trusting it — a plausible-looking pattern is not the
# same as a tested one. In particular a table pattern must keep its closing
# quote: "public"."game_state" without it would also match
# "public"."game_state_meta". The column rows added with the squash
# ("phase", "pending_player_ids", "is_admin") match the bare quoted column
# name rather than name + type, since only "jsonb"'s quoting has been seen
# in a real dump; those rows, like every row new with the squash, have not
# yet been run against one.
#
# Always dumps + reports (read-only, safe). Only when confirm=YES and a
# check with a fix version fails does it revert the baseline's tracking row
# and re-run `db push`. The baseline is written to be re-runnable (`if not
# exists`, `create or replace`, `drop ... if exists` before every trigger
# and policy), so that re-creates any missing table, function, trigger,
# index or policy — but it cannot add a missing *column* to a table that
# already exists; a missing-column row needs a hand-written fix.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to revert + re-apply the baseline if this audit finds any of its objects missing. Leave "no" to just see the report.'
        required: true
        default: 'no'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dump live public schema
        run: supabase db dump --linked -f /tmp/schema.sql

      - name: Show raw dump (diagnostic; secrets redacted)
        run: |
          # supabase_functions.http_request trigger definitions (Database Webhooks)
          # embed their shared secret header values in plaintext — pg_dump only
          # masks the Authorization header, not custom ones like x-webhook-secret.
          # Strip those lines before this ever gets displayed anywhere.
          sed -E 's/^(CREATE OR REPLACE TRIGGER .*"http_request".*)$/-- [REDACTED: webhook trigger definition embeds a shared secret header value, omitted here]/' /tmp/schema.sql > /tmp/schema-redacted.sql
          {
            echo "## Raw schema dump (for debugging the audit patterns below; webhook trigger secrets redacted)"
            echo
            echo "<details><summary>Click to expand — full \`supabase db dump --linked\` output</summary>"
            echo
            echo '```sql'
            cat /tmp/schema-redacted.sql
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit the baseline against the live schema
        id: audit
        run: |
          set -euo pipefail
          schema=/tmp/schema.sql
          missing_versions=""
          leftovers=no
          {
            echo "## Supabase migration audit"
            echo
            echo "| Section | What the migrations should have created | Found? |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # id|description|grep pattern|mode(present/absent)|fix versions (space-separated, or - for report-only)
          #
          # pg_dump double-quotes every identifier ("public"."games", "settings"
          # "jsonb") and truncates identifiers over 63 bytes — patterns below
          # account for both. Table patterns keep their closing quote so
          # "public"."game_state" does not also match "public"."game_state_meta".
          checks='
          helpers|set_updated_at function|"set_updated_at"|present|0001
          profiles|table public.profiles|"public"."profiles"|present|0001
          profiles|profiles_display_name_length constraint|profiles_display_name_length|present|0001
          profiles|profiles.is_admin column|"is_admin"|present|0001
          profiles|profiles.preferences column|"preferences" "jsonb"|present|0001
          profiles|profiles_enforce_is_admin_unchanged trigger|profiles_enforce_is_admin_unchanged|present|0001
          games|table public.games|"public"."games"|present|0001
          games|games.settings column|"settings" "jsonb"|present|0001
          games|games_status_check constraint (canceled status)|games_status_check|present|0001
          games|games_name_length constraint|games_name_length|present|0001
          games|games.game_type column + format constraint|games_game_type_format|present|0001
          games|games_public_idx index|games_public_idx|present|0001
          games|games_enforce_name_immutable trigger|games_enforce_name_immutable|present|0001
          games|games_enforce_status_transition trigger (incl. start-game lockdown)|games_enforce_status_transition|present|0001
          games|admin delete-any-game policy|admins can delete any game|present|0001
          players|table public.players|"public"."players"|present|0001
          players|players delete-own-row policy (hotseat)|users can delete their own player row|present|0001
          players|games_bump_config_version trigger|games_bump_config_version|present|0001
          players|players_enforce_ready_for_version trigger|players_enforce_ready_for_version|present|0001
          game_state|table public.game_state|"public"."game_state"|present|0001
          game_state_meta|table public.game_state_meta|"public"."game_state_meta"|present|0001
          game_state_meta|game_state_meta.phase column|"phase"|present|0001
          game_state_meta|game_state_meta.pending_player_ids column|"pending_player_ids"|present|0001
          game_state_meta|game_state_sync_meta trigger function|"game_state_sync_meta"|present|0001
          rule enforcement|game_state insert lockdown policy|seated players can insert game state when enforcement is off|present|0001
          rule enforcement|game_state update lockdown policy|seated players can update game state when enforcement is off|present|0001
          hidden information|game_state select lockdown policy|read game state when hidden information is off|present|0001
          hidden information|admin game_state read policy|admins can read any game state|present|0001
          push|table public.push_subscriptions|"public"."push_subscriptions"|present|0001
          chat|table public.app_config|"public"."app_config"|present|0001
          chat|table public.chat_messages|"public"."chat_messages"|present|0001
          chat|chat_messages_rate_limit_trigger|chat_messages_rate_limit_trigger|present|0001
          chat|table public.chat_read_status|"public"."chat_read_status"|present|0001
          chat|chat_sender_display_names function|"chat_sender_display_names"|present|0001
          game secrets|table public.game_secrets (0002)|"public"."game_secrets"|present|0002
          game assets|table public.game_assets (0003)|"public"."game_assets"|present|0003
          game assets|game_assets read policy (0003)|read public game assets and your own|present|0003
          game assets|games.assets column (0003)|"assets" "jsonb"|present|0003
          pre-squash leftover|table public.map_pool absent|"public"."map_pool"|absent|-
          pre-squash leftover|table public.observers absent|"public"."observers"|absent|-
          pre-squash leftover|game_state_meta.round_phase column absent (renamed phase)|"round_phase"|absent|-
          pre-squash leftover|profiles unit-colour columns absent|"unit_color_hand"|absent|-
          pre-squash leftover|games_settings_for_listing function absent|"games_settings_for_listing"|absent|-
          '

          while IFS='|' read -r id desc pattern mode fixvers; do
            [ -z "$id" ] && continue
            if grep -qF "$pattern" "$schema"; then found=yes; else found=no; fi
            if [ "$mode" = "absent" ]; then
              # inverted: "found" the old artifact means the cleanup migration did NOT run
              if [ "$found" = "yes" ]; then ok=no; else ok=yes; fi
            else
              ok="$found"
            fi
            if [ "$ok" = "yes" ]; then
              echo "| $id | $desc | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              if [ "$fixvers" = "-" ]; then
                # Report-only: re-running the baseline would not remove it.
                echo "| $id | $desc | ⚠️ PRESENT — not auto-fixed, remove by hand after checking it holds nothing you need |" >> "$GITHUB_STEP_SUMMARY"
                leftovers=yes
              else
                echo "| $id | $desc | ❌ MISSING |" >> "$GITHUB_STEP_SUMMARY"
                missing_versions="$missing_versions $fixvers"
              fi
            fi
          done <<< "$checks"

          if [ "$leftovers" = "yes" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ This project still carries objects from the schema that predates 0001_baseline.sql. The baseline neither creates nor drops them. A pre-production project is best rebuilt (rebuild-preproduction.yml); anywhere else, drop them by hand once you are sure they hold nothing you need." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Dedupe while preserving order, e.g. "0001 0001 0001" -> "0001"
          unique_missing="$(echo "$missing_versions" | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ')"
          echo "missing=$unique_missing" >> "$GITHUB_OUTPUT"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(echo "$unique_missing" | tr -d '[:space:]')" ]; then
            echo "**Result: every checked object is present. Nothing to re-apply.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result: missing migrations →** \`$unique_missing\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Re-run with confirm=YES to revert the baseline's tracking status and re-apply it (it is re-runnable; missing columns on existing tables still need a hand-written fix)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Revert tracking for missing migrations
        if: ${{ github.event.inputs.confirm == 'YES' && steps.audit.outputs.missing != '' }}
        run: |
          set -euo pipefail
          supabase migration repair --status reverted ${{ steps.audit.outputs.missing }}

      - name: Apply the now-pending migrations
        if: ${{ github.event.inputs.confirm == 'YES' && steps.audit.outputs.missing != '' }}
        run: supabase db push --yes

      - name: Re-dump and report post-fix status
        if: ${{ github.event.inputs.confirm == 'YES' && steps.audit.outputs.missing != '' }}
        run: |
          set -euo pipefail
          supabase db dump --linked -f /tmp/schema-after.sql
          {
            echo ""
            echo "## After applying: \`supabase migration list\`"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          supabase migration list >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
