name: Repair Supabase Migration History

# Manually-triggered fix for one specific problem: the remote database
# already has supabase/migrations/0001_baseline.sql's schema in place (e.g.
# it was built up by hand in the Supabase SQL editor), but Supabase's
# tracking table (supabase_migrations.schema_migrations) has no record of
# that, so `supabase db push` tries to replay the baseline and trips over
# objects that already exist.
#
# `supabase migration repair --status applied` only inserts rows into that
# tracking table — it does not run any migration SQL against the database.
# Before relying on it, run audit-and-fix-migrations.yml (read-only by
# default) or eyeball the Table Editor to confirm the schema already matches
# the baseline (e.g. profiles has is_admin, game_state_meta has a `phase`
# column, and no map_pool or observers table exists). If it doesn't, do not
# run this — fix the remote schema first, then use `supabase db push`.
#
# NOT for a project whose history still lists the pre-squash migrations
# (0002 … 0035, 00051). Its schema differs from the baseline, and marking
# the baseline applied would hide that. Rebuild pre-production with
# rebuild-preproduction.yml instead; any other such project needs a
# hand-written migration from its schema to the baseline's.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to mark the baseline migration as applied in the remote history table (no schema SQL is executed)'
        required: true
        default: 'no'

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status before repair
        run: supabase migration list

      - name: Mark the baseline migration as applied
        if: ${{ github.event.inputs.confirm == 'YES' }}
        run: supabase migration repair --status applied 0001

      - name: Show migration status after repair
        if: ${{ github.event.inputs.confirm == 'YES' }}
        run: supabase migration list

      - name: Skipped (confirmation not given)
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: |
          echo "::notice::confirm input was '${{ github.event.inputs.confirm }}', not 'YES' — no repair was performed. Re-run this workflow with confirm=YES once you've verified the remote schema already matches the baseline migration."
