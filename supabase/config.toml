# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Lets `supabase start` bring up a local Postgres + Auth + Realtime + Storage
# + Edge Functions stack (via Docker) so migrations and edge functions can be
# tested against a real instance instead of only type-checked. See
# .github/workflows/claude.yml, which installs the Supabase CLI and Deno so
# this can be driven from a GitHub Actions run.
project_id = "game-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

# No seed data checked in — skip rather than error looking for seed.sql.
[db.seed]
enabled = false

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""

[experimental.pgdelta]
enabled = true

# Every function shares supabase/functions/deno.json, and each one must name it
# here. The Edge Runtime finds that file on its own by walking up from a
# function, but `supabase functions deploy` does not: it bundles in a Docker
# container that sees only the files it chose to mount, and it only follows
# the @game-platform/* specifiers into packages/ when a function's
# `import_map` is set. Without these entries the deploy mounts
# src/games/registry.ts but none of the game packages it imports, and fails
# with `Module not found ".../packages/<game>/src/rules.ts"`.
# edgeFunctionImports.test.ts fails if a function is missing from this list.
[functions.apply-action]
import_map = "./functions/deno.json"

[functions.get-game-state]
import_map = "./functions/deno.json"

[functions.notify-discord-chat]
import_map = "./functions/deno.json"

[functions.notify-discord-lifecycle]
import_map = "./functions/deno.json"

[functions.notify-discord-turn]
import_map = "./functions/deno.json"

[functions.notify-web-push]
import_map = "./functions/deno.json"

[functions.notify-web-push-chat]
import_map = "./functions/deno.json"

[functions.notify-web-push-lifecycle]
import_map = "./functions/deno.json"

[functions.redo-action]
import_map = "./functions/deno.json"

[functions.start-game]
import_map = "./functions/deno.json"

[functions.undo-action]
import_map = "./functions/deno.json"
